# Forge Nova — continuous verification.
# This workflow is the automated ground truth for every push to main:
# the API must typecheck cleanly under strict TypeScript and pass its
# full test suite before a change is considered done.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: forge-nova-api (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Strict typecheck
        run: npm run typecheck

      # Jest failures are re-emitted as GitHub annotations (::error) so the
      # failing suites and case names are visible from the checks API —
      # not only inside logs the API cannot reach. set +e is required:
      # the default -e would exit at the failing npm test line and skip
      # the annotation block entirely.
      - name: Run test suite
        run: |
          set +e
          npm test -- --ci > /tmp/jest.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            { grep -E '^Test Suites:|^Tests:|^FAIL' /tmp/jest.log; grep -E '●|error TS|Cannot find|FATAL' /tmp/jest.log | head -20; tail -8 /tmp/jest.log; } | head -10 | sort -u | while IFS= read -r line; do
              echo "::error::JEST ${line}"
            done
            exit 1
          fi
